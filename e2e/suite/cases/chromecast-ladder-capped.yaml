# max_height selects the richest rendition within it, which Castor serves to the Chromecast.
stream:
  packaging: hls-ts
  video: {codec: h264, ladder: [240, 480, 720]}
  audio: {codec: aac, channels: 2}
receiver:
  device: chromecast
castor:
  cast:
    max_height: 480
expect:
  delivery: served
  video: copied
