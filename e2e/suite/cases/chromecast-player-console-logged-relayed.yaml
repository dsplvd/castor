# Castor finds and serves a stream a page only names in its console.
command:
  player:
    stream: {logged: '[hls] attaching source %s'}
stream:
  packaging: hls-ts
  video: {codec: h264, height: 360}
  audio: {codec: aac, channels: 2}
  seconds: 300
receiver:
  device: chromecast
expect:
  delivery: served
  video: copied
