# A live AES-128 HLS edge with a tokenised key stays playable when Castor follows and serves it.
stream:
  packaging: hls-ts-aes128
  video: {codec: h264, height: 360}
  audio: {codec: aac, channels: 2}
  seconds: 20
origin:
  live: {start: 4, every: 1s, end: endlist}
receiver:
  device: chromecast
expect:
  delivery: served
  video: copied
