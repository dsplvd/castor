# Every variant declares the same BANDWIDTH: RESOLUTION breaks the tie, so Castor serves the 480p rung.
stream:
  packaging: hls-ts
  video: {codec: h264, ladder: [240, 360, 480]}
  audio: {codec: aac, channels: 2}
origin:
  rewrites-master: {bandwidth: flat}
receiver:
  device: chromecast
expect:
  delivery: served
  video: copied
