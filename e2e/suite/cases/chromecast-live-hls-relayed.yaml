# Castor follows a live HLS edge and serves its segments to the Chromecast.
stream:
  packaging: hls-ts
  video: {codec: h264, height: 360}
  audio: {codec: aac, channels: 2}
  seconds: 20
origin:
  live: {start: 4, every: 1s, end: endlist}
receiver:
  device: chromecast
expect:
  delivery: served
  video: copied
